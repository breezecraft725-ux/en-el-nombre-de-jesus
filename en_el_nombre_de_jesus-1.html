<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>En el nombre de Jesús</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #111;
    color: white;
    font-family: Georgia, "Times New Roman", serif;
    position: relative;
  }
  .cross {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, serif;
    font-size: min(75vw, 75vh);
    line-height: 1;
    color: rgba(255,255,255,0.10);
    user-select: none;
  }
  .text {
    position: relative;
    z-index: 1;
    text-align: center;
    font-size: clamp(42px, 8vw, 110px);
    font-weight: bold;
    line-height: 1.08;
    letter-spacing: 1px;
    text-shadow: 0 3px 18px rgba(0,0,0,.7);
    padding: 30px;
  }
</style>
</head>
<body>
  <div class="cross">✝</div>
  <div class="text">En el nombre<br>de Jesús</div>
</body>
</html>
